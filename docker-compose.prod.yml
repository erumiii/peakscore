services:
  app:
    image: keenanmz/peakscore:${IMAGE_TAG:-latest}
    env_file: .env
    restart: unless-stopped
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: keenanmz/peakscore-nginx:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - app

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  storage_data:
