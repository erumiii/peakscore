name: CI

on: [push]

jobs:
  sast_test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
      
      - name: Install progpilot
        run: composer require designsecurity/progpilot

      - name: Run progpilot scan
        run: vendor/bin/progpilot .
