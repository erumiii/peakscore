name: CI

on: [push]

jobs:
  secrets_scanning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Secret Scanning
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
  sast_and_sca_scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
      
      - name: Install progpilot
        run: composer require designsecurity/progpilot

      - name: Run progpilot scan
        run: vendor/bin/progpilot . > progpilot-results.json

      - name: Dependencies scan
        continue-on-error: true
        run: composer audit --ignore-severity=low --ignore-severity=medium --format=json > composer-audit-report.json

      - name: Upload SAST and SCA scan artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Composer audit and progpilot findings
          path: |
            progpilot-results.json
            composer-audit-report.json

  build_and_test_image:
    needs: [sast_and_sca_scan, secrets_scanning]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Docker
        uses: docker/setup-buildx-action@v4
        
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      
      - name: Build App image
        run: docker build -f Dockerfile -t ${{ vars.DOCKERHUB_REPO }}:${{ env.SHORT_SHA }} .
      
      - name: Build Nginx image
        run: docker build -f docker/nginx/Dockerfile -t ${{ vars.DOCKERHUB_REPO }}-nginx:${{ env.SHORT_SHA }} .

      - name: Setup Docker Scout
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh -o install-scout.sh
          sh install-scout.sh

          echo ${{ secrets.DOCKER_PWD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker scout quickview ${{ vars.DOCKERHUB_REPO }}:${{ env.SHORT_SHA }}
          docker scout cves --only-severity critical,high --format sarif --output docker-scout-app-report.json ${{ vars.DOCKERHUB_REPO }}:${{ env.SHORT_SHA }}
          
          docker scout quickview ${{ vars.DOCKERHUB_REPO }}-nginx:${{ env.SHORT_SHA }}
          docker scout cves --only-severity critical,high --format sarif --output docker-scout-nginx-report.json ${{ vars.DOCKERHUB_REPO }}-nginx:${{ env.SHORT_SHA }}

      - name: Push App image to Docker Hub
        run: docker image push ${{ vars.DOCKERHUB_REPO }}:${{ env.SHORT_SHA }}

      - name: Push Nginx image to Docker Hub
        run: docker image push ${{ vars.DOCKERHUB_REPO }}-nginx:${{ env.SHORT_SHA }}

      - name: Promote image to latest
        run: |
          docker buildx imagetools create \
            -t ${{ vars.DOCKERHUB_REPO }}:latest \
            ${{ vars.DOCKERHUB_REPO }}:${{ env.SHORT_SHA }}
          docker buildx imagetools create \
            -t ${{ vars.DOCKERHUB_REPO }}-nginx:latest \
            ${{ vars.DOCKERHUB_REPO }}-nginx:${{ env.SHORT_SHA }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ vars.DOCKERHUB_REPO }}:${{ env.SHORT_SHA }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload Image scan and SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: Docker Scout findings
          path: |
            docker-scout-app-report.json
            docker-scout-nginx-report.json
            sbom.cdx.json
