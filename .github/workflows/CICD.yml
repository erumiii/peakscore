name: CI

on: [push]

jobs:
  sast_test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
      
      - name: Install progpilot
        run: composer require designsecurity/progpilot

      - name: Run progpilot scan
        run: vendor/bin/progpilot .

  build_and_test_image:
    needs: sast_test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3
        
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      
      - name: Build image
        run: docker build -f Dockerfile -t ${{ vars.DOCKERHUB_REPO }}:${{ env.SHORT_SHA }} .

      - name: Setup Docker Scout
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh -o install-scout.sh
          sh install-scout.sh

          echo ${{ secrets.DOCKER_PWD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker scout quickview ${{ vars.DOCKERHUB_REPO }}:${{ env.SHORT_SHA }}
          docker scout cves --only-severity critical,high --format sarif --output docker-scout-report.json ${{ vars.DOCKERHUB_REPO }}:${{ env.SHORT_SHA }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Docker Scout findings
          path: docker-scout-report.json 
