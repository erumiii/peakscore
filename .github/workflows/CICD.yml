name: CI

on: [push]

jobs:
  sast_test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
      
      - name: Install progpilot
        run: composer require designsecurity/progpilot

      - name: Run progpilot scan
        run: vendor/bin/progpilot .

  build_and_test_image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3
        
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      
      - name: Build image
        run: docker build -f Dockerfile -t keenanmz/peakscore:${{ env.SHORT_SHA }} .

      - name: Setup Docker Scout
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh -o install-scout.sh
          sh install-scout.sh
          docker scout quickview keenanmz/peakscore:${{ env.SHORT_SHA }}
          docker scout cves keenanmz/peakscore:${{ env.SHORT_SHA }}
